<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex">
<title>Hairpin social image artwork</title>
<style>
@font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 400 700; src: url("fonts/BodoniModa-Italic.woff2") format("woff2"); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { color: #3B3852; background: #FFF6EE; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
.artwork { position: relative; width: 1200px; height: 630px; isolation: isolate; overflow: hidden; }
.artwork::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(ellipse at 87% 48%, #FFD8E3 0%, #FFE7EB 30%, transparent 65%);
}
.copy { position: relative; z-index: 2; padding: 58px 0 0 64px; width: 660px; }
.brand { display: flex; align-items: center; gap: 17px; }
.brand img { width: 76px; height: 76px; }
.brand span { font: italic 500 58px/1 "Bodoni Moda", Georgia, serif; letter-spacing: -1px; }
h1 { margin: 43px 0 21px; font-size: 55px; line-height: 1.12; font-weight: 650; letter-spacing: -2px; }
h1 span { display: block; color: #C2345C; }
.description { margin: 0; max-width: 510px; font-size: 25px; line-height: 1.48; color: #6E6987; }
.author { display: flex; align-items: center; gap: 13px; margin-top: 47px; font-size: 19px; color: #6E6987; }
.author img { width: 42px; height: 42px; border-radius: 50%; }
.author strong { color: #3B3852; font-weight: 600; }
.portrait { position: absolute; z-index: 1; width: 558px; height: auto; right: -11px; bottom: -17px; }
</style>
</head>
<body>
<main class="artwork" aria-label="Hairpin social sharing image">
  <div class="copy">
    <div class="brand"><img src="icon.png" alt="Hairpin logo"><span>Hairpin</span></div>
    <h1>Hidden by the notch.<span>Back within reach.</span></h1>
    <p class="description">A tiny macOS app for the menu bar<br>icons you can’t see.</p>
    <div class="author"><img src="avatar.jpg" alt=""><span>Made by <strong>AriesZhou</strong></span></div>
  </div>
  <img class="portrait" src="mascot.webp" alt="Hairpin’s pink-haired character wearing a bow and hairpin">
</main>
</body>
</html>
