<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex">
<title>Hairpin README banner artwork</title>
<style>
@font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 400 700; src: url("fonts/BodoniModa-Italic.woff2") format("woff2"); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 400px; overflow: hidden; }
body { color: #3B3852; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
.artwork { position: relative; width: 1200px; height: 400px; overflow: hidden; border-radius: 16px; background: #FFF6EE; isolation: isolate; }
.artwork::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at 92% 65%, #FFDEE7, transparent 62%); }
.brand { position: absolute; z-index: 2; top: 29%; left: 6%; display: flex; align-items: center; gap: 26px; }
.brand img { width: 113px; height: 113px; }
.brand span { font: italic 600 98px/1 "Bodoni Moda", Georgia, serif; letter-spacing: -2.6px; }
.tagline { position: absolute; z-index: 2; left: 6.6%; top: 65%; margin: 0; color: #6E6987; font-size: 26px; line-height: 1.4; }
.portrait { position: absolute; right: 0; bottom: -4%; height: 108%; width: auto; }
</style>
</head>
<body>
<main class="artwork" aria-label="Hairpin: Hidden by the notch. Back within reach.">
  <div class="brand"><img src="icon.png" alt="Hairpin app logo"><span>Hairpin</span></div>
  <p class="tagline">Hidden by the notch.<br>Back within reach.</p>
  <img class="portrait" src="mascot.webp" alt="Hairpin's pink-haired mascot wearing a bow and hairpin">
</main>
</body>
</html>
