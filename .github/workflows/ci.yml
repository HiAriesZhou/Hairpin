name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job may write, and only it sees the
# signing secrets. Third-party code runs at pinned commits.
permissions:
  contents: read

jobs:
  # Every push and pull request: build, test and package, ad hoc signed.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # The test target doesn't depend on the app, so build it explicitly.
      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle
        run: scripts/bundle.sh

      - name: Update integration and feed validation
        run: scripts/test-updates.sh

      - name: Disk image
        run: scripts/dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hairpin
          path: |
            Hairpin.zip
            Hairpin.dmg
          if-no-files-found: error

  # Version tags (which only the maintainer can create): sign with the
  # Developer ID, notarize and publish. This is the only job that reads the
  # signing secrets, and pull requests from forks never run with them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    concurrency:
      group: stable-release
      cancel-in-progress: false
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'error: stable vX.Y.Z tag required' >&2; exit 1; }
          NOTES="docs/release-notes/$TAG.txt"
          [[ -f "$NOTES" ]] && grep -q '[^[:space:]]' "$NOTES" || { echo "error: missing or empty release notes: $NOTES" >&2; exit 1; }
          cp "$NOTES" "$RUNNER_TEMP/release-notes.txt"

      # Secrets are decoded into files in the runner's temporary directory and
      # never printed; the keychain and files are removed at the end.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12_BASE64" || -z "$CERT_PASSWORD" ]]; then
            echo "error: no signing certificate in the repository secrets" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "error: the certificate holds no Developer ID Application identity" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Notarization credentials
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ -z "$NOTARY_KEY_P8_BASE64" || -z "$NOTARY_KEY_ID" || -z "$NOTARY_ISSUER_ID" ]]; then
            echo "error: no notarization key in the repository secrets; Gatekeeper would block the build" >&2
            exit 1
          fi
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Bundle (signed)
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/bundle.sh

      - name: Notarize app
        run: scripts/notarize.sh app

      - name: Disk image (signed)
        run: scripts/dmg.sh

      - name: Notarize disk image
        run: scripts/notarize.sh dmg

      - name: Prepare draft and previous feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'error: stable vX.Y.Z tag required' >&2; exit 1; }
          mkdir -p .build/update-feed
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest-release.json"
          if jq -e '.assets[] | select(.name == "appcast.xml")' "$RUNNER_TEMP/latest-release.json" >/dev/null; then
            PREVIOUS_TAG="$(jq -r .tag_name "$RUNNER_TEMP/latest-release.json")"
            gh release download "$PREVIOUS_TAG" --pattern appcast.xml --dir .build/update-feed
            mv .build/update-feed/appcast.xml .build/update-feed/previous.xml
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          EXISTING="$(jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .draft' "$RUNNER_TEMP/releases.json")"
          if [[ "$EXISTING" == false ]]; then
            echo 'error: refusing to replace an already published release' >&2
            exit 1
          elif [[ "$EXISTING" == true ]]; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.txt"
          else
            gh release create "$TAG" --draft --verify-tag --title "Hairpin $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo 'error: missing Sparkle signing key' >&2; exit 1; }
          if [[ -f .build/update-feed/previous.xml ]]; then
            scripts/appcast.sh "$TAG" "$RUNNER_TEMP/release-notes.txt" .build/update-feed/previous.xml
          else
            scripts/appcast.sh "$TAG" "$RUNNER_TEMP/release-notes.txt"
          fi

      - name: Upload, verify and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" Hairpin.zip Hairpin.dmg .build/update-feed/appcast.xml --clobber
          mkdir -p "$RUNNER_TEMP/release-check"
          gh release download "$TAG" --dir "$RUNNER_TEMP/release-check"
          cmp Hairpin.zip "$RUNNER_TEMP/release-check/Hairpin.zip"
          cmp Hairpin.dmg "$RUNNER_TEMP/release-check/Hairpin.dmg"
          cmp .build/update-feed/appcast.xml "$RUNNER_TEMP/release-check/appcast.xml"
          gh release edit "$TAG" --draft=false --latest

      - name: Remove signing material
        if: always()
        run: |
          [[ -n "${KEYCHAIN:-}" ]] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
