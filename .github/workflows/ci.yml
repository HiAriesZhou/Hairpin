name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # The test target doesn't depend on the app, so build it explicitly.
      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          scripts/bundle.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hairpin
          path: Hairpin.zip
          if-no-files-found: error

      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Hairpin.zip --clobber
            gh release edit "$TAG" --prerelease
          else
            gh release create "$TAG" Hairpin.zip --prerelease --verify-tag \
              --title "Hairpin $TAG" --generate-notes
          fi
